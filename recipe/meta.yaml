{% set python_min = "3.10" %}
{% set version = "1.16.0" %}

package:
  name: geoviews-core
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/g/geoviews/geoviews-{{ version }}.tar.gz
  sha256: 7ce377c3a7aedc1aaf1a97f412be514d9bc426acfbe671d703b369a2b99a1784

build:
  number: 0

outputs:
  - name: geoviews-core
    build:
      noarch: python
      script: python -m pip install . --no-deps -vv
      entry_points:
        - geoviews = geoviews.__main__:main
    requirements:
      run_constrained:
        - geoviews {{ version }}
      host:
        - python {{ python_min }}
        - pip
        # These are also needed at build time and declared in the pyproject.toml
        - bokeh =3.8
        - nodejs >=20
        - hatchling
        - hatch-vcs
      run:
        - python >={{ python_min }}
        - bokeh >=3.8.0
        - cartopy >=0.18.0
        - holoviews >=1.16.0
        - numpy >=1.0
        - packaging
        - panel >=1.0.0
        - param >=1.9.3,<3.0
        - pyproj
        - shapely >=1.8.0
        - xyzservices
    test:
      requires:
        - pip
        - python {{ python_min }}
      commands:
        - pip check
      imports:
        - geoviews

  - name: geoviews
    build:
      noarch: python
    requirements:
      - python >={{ python_min }}
      - {{ pin_subpackage('geoviews-core', exact=True) }}
      - datashader
      - geopandas-base
      - netcdf4
      - pandas
      - pyct
      - xarray
    test:
      imports:
        - geoviews
      requires:
        - nbval
        - pytest
        - python {{ python_min }}
      commands:
        - geoviews examples --path=. --force
        # just run one notebook for now; increase in the future if notebooks can be run quickly with test/tiny data
        - pytest --nbval-lax -k Projections.ipynb
    about:
      home: https://geoviews.org
      license: BSD-3-Clause
      license_file: LICENSE
      summary: GeoViews is a Python library that makes it easy to explore and visualize geographical, meteorological, and oceanographic datasets, such as those used in weather, climate, and remote sensing research.

about:
  home: https://geoviews.org
  license: BSD-3-Clause
  license_file: LICENSE
  summary: GeoViews is a Python library that makes it easy to explore and visualize geographical, meteorological, and oceanographic datasets, such as those used in weather, climate, and remote sensing research.
extra:
  recipe-maintainers:
    - ahuang11
    - ocefpaf
    - philippjfr
    - maximlt
    - Hoxbro
